        - ["Konverterpaar, EUR/kW", "TODO", "{{csv|data/costs/archive/v0.15.0/costs_2035.csv|technology=HVDC inverter pair;parameter=investment|value|0}}", "TODO", "DEA 2025 / TODO Rolle 1"]
        - ["Lebensdauer, a", "", "40", "", "DEA, E2"]
        - ["WACC, real", "", "10 %", "", "E2; Begründung TODO Rolle 1"]
        - ["Verluste über die Strecke", "", "TODO", "", "TODO Rolle 1"]
