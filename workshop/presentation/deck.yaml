      - "Tiefe meidend: {{csv|results/cable-route/summary.csv|avoid-deep|length_km|0}} km, max. {{csv|results/cable-route/summary.csv|avoid-deep|max_depth_m|0}} m"
      - "Jenseits der qualifizierten 3.000 m: {{csv|results/cable-route/summary.csv|shortest|beyond_qualified_km|0}} km bzw. {{csv|results/cable-route/summary.csv|avoid-deep|beyond_qualified_km|0}} km – ohne Vorbild"
      - "Im Modell: Großkreis × 1,25 = {{csv|results/cable-route/summary.csv|shortest|model_default_km|0}} km (TODO Rolle 1/3: Route ins Modell übernehmen oder Abweichung begründen)"
