      - "TODO Rolle 3: Nachbarländer und Handel, Netto-Importgrenze ≈ 25 TWh/a (Quelle, O2)"
      - "TODO Rolle 3: Anschlussknoten des Kabels"
      - "TODO Rolle 3: weitere Verbesserungen, je mit Quelle und Wirkung"
    source: "workshop/BASELINE.md; Lieferung Rolle 3"

  - id: zwischenschritte
