      - "Wind schlägt Solar am Standort (optimaler Windanteil {{csv|results/brazil-validation/region_scan_2035.csv|CE east (Aracati)|wind_share_opt|1}})"
      - "Brasilien ist reiner Exportstandort: keine Nachfrage, kein Netz in Brasilien"
