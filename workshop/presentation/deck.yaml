# Gliederung der Abschlusspräsentation (workshop/presentation/README.md).
# build_deck.py baut daraus results/presentation/praesentation-<datum>.pptx.
#
# Keine Zahl abtippen: Platzhalter verwenden (README Abschnitt 5).
#   {{m|RUN|JAHRE|Sektion/Kennzahl|DEZ}}        metrics.csv
#   {{c|RUN|REF|JAHRE|Sektion/Kennzahl|DEZ}}    comparisons.csv (mit Vorzeichen)
#   {{csv|PFAD|ZEILE|SPALTE|DEZ}}               Zelle einer Lieferung; ZEILE = Indexwert
#                                               oder spalte=wert;spalte=wert
#   {{date}}  {{status}}
# JAHRE: 2040 oder 2035-2045 (Mittel der vorhandenen Jahre).
# TODO im Text = eine Rolle muss noch liefern; --final bricht dann ab.
#
# NIE einen Wert, ein Verhältnis, den Deal-Code oder Garantiebedingungen aus
# workshop/inputs/ hier eintragen (decisions.md E7).
#
# Felder je Folie:
#   id, part, layout (title | section | bullets | figure | table | kpi),
#   title (Aussage, nicht Thema), subtitle (Frage, E-Nummer oder Vergleichspaar),
#   bullets, figure, table {header, rows}, kpis [{value, label, group}],
#   requires (Läufe, die fertig sein müssen), source (Fußzeile), owner (Rolle),
#   notes (Sprechernotizen), optional (true: entfällt bei umfang=kurz),
#   test (true: entfällt bei testlaeufe=weglassen), nda_hinweis (true: nur bei nda_hinweis=qualitativ)
# Automatische Tabellen: table: {auto: status | daten | annahmen | entscheidungen, phasen: ["1", "2"]}
#   daten/annahmen/entscheidungen kommen aus register.yaml (Daten, Annahmen, Entscheidungen mit Wirkung).

meta:
  title: "Ein Kabel von Brasilien nach Deutschland: lohnt es sich?"
  subtitle: "PyPSA x AI Workshop – Studie der Gruppe"
  authors: "Rolle 1 Kabel · Rolle 2 Brasilien · Rolle 3 PyPSA-Eur · Rolle 4 Ökonomie · Rolle 5 Review"
  font: "Libre Franklin"

slides:
  # ------------------------------------------------------------------ Einstieg
  - id: titel
    layout: title
    owner: 4
    bullets:
      - "Stand {{date}} · {{status}}"

  - id: kernaussage
    layout: bullets
    owner: 4
    title: "Kernaussage"
    subtitle: "Die Antwort vorweg – Begründung auf den folgenden Folien"
    requires: [REF, CABLE, MV]
    bullets:
      - "TODO Rolle 4: Baut das Modell das Kabel? Kapazität 2035–2045 aus CABLE: {{m|CABLE|2045|Kabel/Kapazität|1}} GW (2045)"
      - "TODO Rolle 4: Abstand zum Break-even (MV): {{m|MV|2035-2045|Kabel/Abstand zum Break-even pro kW|0}} EUR/kW/a"
      - "TODO Rolle 4: Wovon es abhängt (CAPEX50, WACC7, Handel) – ein Satz"
      - "TODO Rolle 4: Wer gewinnt, wer verliert – ein Satz"
    source: "workshop/results/notes.md, metrics.csv, comparisons.csv"
    notes: "Aussagen wörtlich aus notes.md übernehmen; keine neue Deutung auf der Folie."

  - id: frage-2050
    layout: figure
    owner: 4
    title: "Mit dem Nullcap 2050 sähe jede saubere Quelle wertvoll aus"
    subtitle: "Der Auftrag lautet 'amazing solution' – wir prüfen, unter welchen Bedingungen"
    figure: workshop/results/figures/BASE_co2.png
    requires: [BASE]
    bullets:
      - "Baseline 2050: die Obergrenze legt {{m|BASE|2050|CO2/Schattenpreis der Obergrenze|0}} EUR/t auf den CO₂-Preis"
      - "Höchster Strompreis 2050: {{m|BASE|2050|Preise/Strompreis Maximum|0}} EUR/MWh"
      - "Deshalb: weicher Cap 2050 und Handel in allen Studienläufen (E3)"
    source: "Lauf BASE (de10-myopic); workshop/README.md; decisions.md E3"

  - id: entscheidungspfad
    layout: table
    owner: 4
    title: "Wie wir zur Studie kamen: Entscheidungen und ihre Wirkung"
    subtitle: "Ausgangslage und Studiendesign – jede Entscheidung mit dem Schritt, in dem sie gewirkt hat"
    table: {auto: entscheidungen, phasen: ["1", "2"]}
    source: "workshop/presentation/register.yaml; workshop/decisions.md"
    notes: "Von oben nach unten erzählen: Befund der Baseline → Designentscheidung → wo sie greift."

