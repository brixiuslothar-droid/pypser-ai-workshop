      - "TODO Rolle 1: Machbarkeit bis 20 GW (Anzahl Bipole, O3)"
    source: "data/costs/archive/v0.15.0 (Danish Energy Agency 2025); Lieferung Rolle 1"
    notes: "Preisbasis prüfen: die Kostentabelle führt currency_year; E2 verlangt EUR_2020."

  - id: standort-brasilien
    layout: figure
    part: A
    owner: 2
