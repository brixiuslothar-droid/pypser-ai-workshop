# Register der Studie: Daten, Annahmen und Entscheidungen mit ihrer Wirkung.
# Quelle für die Dokumentationsfolien der Präsentation (build_deck.py, Folien mit
# `register:`) und für den Anhang. Jede Rolle pflegt ihre Einträge; Rolle 4
# pflegt E1–E8. Zahlen nur als Platzhalter (README Abschnitt 5).
#
# NDA (decisions.md E7): Einträge mit `nda: true` beschreiben Daten aus
# workshop/inputs/ oder Größen, die daraus berechnet werden. Für sie gilt:
#   - `quelle` nennt nur die Art der Quelle VOR der Verarbeitung
#     ("vertrauliche Projektdaten (NDA)"), nie Dateiname, Deal, Partner oder Wert;
#   - `wert`, `ergebnis` und Platzhalter sind verboten; build_deck.py bricht ab;
#   - `verarbeitung` nennt das Skript, `verwendung` sagt, wofür (nur Validierung).
#
# Felder
#   daten:         id, name, quelle, jahr, verarbeitung, ergebnis, rolle, nda
#   annahmen:      id, name, wert, quelle, rolle, wirkung (Richtung für den Kabelwert)
#   entscheidungen id, wann (Phase), wer, entscheidung, warum, schritt (Zwischenschritt:
#                  Lauf, Datei oder Befund), wirkung (was es im Schritt bewirkt hat),
#                  quelle, requires (Läufe für die Platzhalter in `wirkung`)
#   uebergaben:    pfad, rolle, eingearbeitet (Datum), sha (erste 12 Zeichen sha256);
#                  build_deck.py meldet jede Übergabe, die sich seither geändert hat
#
# Platzhalter auf Übergaben (README "Platzhalter"):
#   {{md|DATEI|ÜBERSCHRIFT|ZEILE|SPALTE[|TEIL]}}  Zelle einer Markdown-Tabelle; TEIL wählt
#                                                einen Wert aus "a → b → c" (0, 1, -1)
#   {{cfg|DATEI|schlüssel.pfad}}                 Wert aus einer Config
#   {{src|DATEI|wörtlicher Text}}                Text, der in der Übergabe stehen muss

