    rolle: 1
  - id: D2
    name: Kostendaten HVDC-Kabel und Konverter
    quelle: Danish Energy Agency, Technology Data for Energy Transport
    jahr: 2025
    verarbeitung: data/costs/archive/v0.15.0 → process_cost_data
    ergebnis: resources/<run>/costs_<jahr>_processed.csv
    rolle: 1
  - id: D3
    name: Wetter Brasilien (Wind, Solar)
    quelle: ERA5 über atlite-Cutout (data-brazil/weather)
    jahr: 2013
    verarbeitung: workshop/brazil/scan_regions.py, build_brazil_import_profile
    ergebnis: results/brazil-validation/region_scan_2035.csv
    rolle: 2
  - id: D4
    name: Gemessene Windeinspeisung Brasilien
    quelle: ONS open data (data-brazil/raw/ons)
    jahr: 2013
    verarbeitung: workshop/brazil/validate_wind.py
    ergebnis: results/brazil-validation/wind_validation.csv
    rolle: 2
  - id: D5
    name: Investitionskosten Brasilien
    quelle: IRENA, Renewable Power Generation Costs in 2023; Kostentabellen v0.15.0
    jahr: 2023
    verarbeitung: workshop/brazil/brazil_costs.py
    ergebnis: results/brazil-validation/brazil_costs.csv
    rolle: 2
  - id: D6
    name: Deutsches Stromsystem (Netz, Kraftwerke, Last, Profile)
    quelle: PyPSA-Eur Baseline (OSM-Netz, powerplantmatching, ENTSO-E-Last, ERA5)
    jahr: 2013
    verarbeitung: Workflow bis compose_network (BASELINE.md)
    ergebnis: results/de10-myopic/networks/
    rolle: 3
  - id: D7
    name: Nachfrageentwicklung
    quelle: TYNDP 2024 Distributed Energy (ohne Elektrolyse)
    jahr: 2024
    verarbeitung: load.scaling_factor in config/config.workshop.yaml
    ergebnis: Faktor 1,0 bis 1,5 bis 2050
    rolle: 3
  - id: D8
    name: Netto-Import Deutschland heute
    quelle: "Energy-Charts, grenzüberschreitender Handel DE (API cbet), abgefragt 2026-11-27"
    jahr: 2024
    verarbeitung: Summe der 15-min-Werte; Anteil der neun Modell-Nachbarn (workshop/role3/handover.md)
    ergebnis: "28,3 TWh gesamt, 19,9 TWh aus den Modell-Nachbarn → Grenze {{cfg|config/config.role3-e3.yaml|role3.net_import_limit.twh}} TWh/a (role3.net_import_limit)"
    rolle: 3
  - id: D10
    name: Grenzkuppelkapazitäten (NTC) Deutschland
    quelle: "ENTSO-E/ENTSOG TYNDP 2024, Reference Grid & Investment Candidates (2023-11-03), CC BY 4.0"
    jahr: 2023
    verarbeitung: role3.crossborder.ntc in config/config.role3-reference.yaml, data/role3_constraints.py
    ergebnis: "Summe der Flüsse je Grenze ≤ NTC, z. B. AT {{cfg|config/config.role3-reference.yaml|role3.crossborder.ntc.values.AT}} GW (Export, Import)"
    rolle: 3
  - id: D11
    name: Nachbarländer AT, BE, CH, CZ, DK, FR, LU, NL, PL
    quelle: PyPSA-Eur (OSM-Netz, powerplantmatching, ENTSO-E-Last, ERA5)
    jahr: 2013
    verarbeitung: config/config.role3-neighbours.yaml (20 Knoten, davon DE 10)
    ergebnis: Läufe de10-nb9, de10-nb9-ref
    rolle: 3
  - id: D12
    name: CO₂-Preis 2050 aus der Literatur
    quelle: "IPCC AR6 WGIII Kap. 3 (C1-Pfade); IEA NZE 2023; UBA Methodenkonvention 4.0; Sievert et al., Joule 2024"
    jahr: 2023
    verarbeitung: workshop/role3/neighbours.md (eigene Umrechnung nach EUR)
    ergebnis: "750 EUR/t zentral, Spanne 250–1.250 EUR/t (E3)"
    rolle: 3
  - id: D13
    name: Übergabe gelöster Läufe an Rolle 4 (Hand-off)
    quelle: gelöste Netze results/<run>/networks/ (Rolle 3)
    jahr: 2026
    verarbeitung: workshop/role3/export_handoff.py (nur Aggregate je Land und Carrier)
    ergebnis: "workshop/role3/handoff/<run>/ (im Repo): manifest.yaml, system_costs, prices, trade, co2, cable; liest evaluate.py, wenn die Netze fehlen"
    rolle: 3
  - id: D9
    name: Kabelsystem und Finanzierung (Validierung)
    quelle: vertrauliche Projektdaten (NDA), vor der Verarbeitung
    verarbeitung: workshop/cba/validate_against_nda.py, nur zur Laufzeit
    verwendung: Plausibilisierung der öffentlichen Annahmen D2 und A3; kein Modellinput
    rolle: 4
    nda: true

