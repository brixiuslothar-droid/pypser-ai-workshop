  - {pfad: workshop/role3/baseline-check.md, rolle: 3, eingearbeitet: 2026-11-27, sha: 06d87ae0b231}
  - {pfad: workshop/role3/integration-status.md, rolle: 3, eingearbeitet: 2026-11-27, sha: f81aa76eb66e}
  - {pfad: config/config.role3-neighbours.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 3550d3ebe0fe}
  - {pfad: config/config.role3-reference.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 081f762c3785}
  - {pfad: config/config.role3-e3.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 6308ad1932c8}
  - {pfad: config/config.role3-e3-cable.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 8a0de87f7a84}
  - {pfad: config/config.role3-cable.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 60f1a213da6a}
  - {pfad: workshop/role3/handoff/README.md, rolle: 3, eingearbeitet: 2026-11-27, sha: 7ea37dc24279}
  - {pfad: workshop/role3/handoff/de10-ref/manifest.yaml, rolle: 3, eingearbeitet: 2026-11-27, sha: 02ea37cff520}
