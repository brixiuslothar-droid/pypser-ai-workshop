    wert: "nächster DE-Bus zu landing_de; de10-cable: Conneforde {{cfg|config/config.role3-e3-cable.yaml|brazil_import.landing_de}} → Weser-Ems ({{md|workshop/role3/handover.md|Rolle 1 und 2|Weser-Ems|de10-nb9}})"
