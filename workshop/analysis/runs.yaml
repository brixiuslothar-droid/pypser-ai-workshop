# Runs and comparisons the results pipeline evaluates (workshop/decisions.md E4).
# A run is evaluated once results/<run_name>/networks/solved_<year>.nc exist;
# runs without results are listed as "planned" in the report.
#
# run_name must match the run name in config/scenarios.yaml (role 3 sets it up).
# configs: the config files the run is solved with, in the order Snakemake gets
# them; the pipeline reads CO2 price and cap from them (on top of config.default.yaml).

horizons: [2025, 2030, 2035, 2040, 2045, 2050]

runs:
  BASE:
    run_name: de10-myopic
    configs: [config/config.workshop.yaml]
    description: Workshop baseline, Germany as an island, hard zero CO2 cap in 2050
  REF:
    run_name: de10-ref
    parent: BASE
    configs: [config/config.workshop.yaml]   # + scenario entry in config/scenarios.yaml
    description: Trade with neighbours, soft CO2 cap 2050, no cable
  CABLE:
    run_name: de10-cable
    parent: REF
    configs: [config/config.workshop.yaml]
    description: REF + Brazil cable extendable from 2035, WACC per E2 (main run)
  MV:
    run_name: de10-mv
    parent: CABLE
    configs: [config/config.workshop.yaml]
    description: CABLE with the cable forced to 0.1 GW (marginal value)
  CAPEX50:
    run_name: de10-capex50
    parent: CABLE
    configs: [config/config.workshop.yaml]
    description: CABLE with 50 % cable investment cost
  WACC7:
    run_name: de10-wacc7
    parent: CABLE
    configs: [config/config.workshop.yaml]
    description: CABLE with 7 % WACC for Brazil and the cable
  REF-ISL:
    run_name: de10-ref-isl
    parent: REF
    configs: [config/config.workshop.yaml]
    description: REF without trade
  CABLE-ISL:
    run_name: de10-cable-isl
    parent: CABLE
    configs: [config/config.workshop.yaml]
    description: CABLE without trade

# Differences "run - reference" the report shows (E4).
comparisons:
  - [CABLE, REF]
  - [MV, REF]
  - [CAPEX50, REF]
  - [WACC7, REF]
  - [CABLE-ISL, REF-ISL]
  - [REF, BASE]
